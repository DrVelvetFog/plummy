<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Untitled Document</title>
<style>
  body { margin: 0; width: 1280px; height: 800px; background: #f2f2f7; font-family: -apple-system, Helvetica, sans-serif; }
  .titlebar { height: 52px; background: #e8e8ed; border-bottom: 1px solid #d1d1d6; display: flex; align-items: center; padding: 0 20px; font-size: 15px; color: #333; }
  .doc { width: 720px; margin: 60px auto 0; background: white; border-radius: 8px; box-shadow: 0 2px 10px rgba(0,0,0,.08); padding: 40px; color: #222; line-height: 1.6; }
  .doc h1 { font-size: 22px; margin-top: 0; }
  #save-btn { position: absolute; left: 540px; top: 400px; width: 200px; height: 60px; background: #0a84ff; color: white; border: none; border-radius: 10px; font-size: 19px; font-weight: 600; }
</style>
</head>
<body>
  <div class="titlebar">Untitled Document — Edited</div>
  <div class="doc">
    <h1>Meeting notes</h1>
    <p>Quarterly review moved to Thursday. Bring the updated numbers and the draft slides.</p>
    <p>Follow up with the vendor about the renewal terms before the end of the week.</p>
  </div>
  <button id="save-btn">Save</button>
</body>
</html>
