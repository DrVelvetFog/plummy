name: GooglyEyes
options:
  bundleIdPrefix: co.visionairy.googly
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
targets:
  GooglyEyes:
    type: application
    platform: iOS
    sources:
      - path: iOS/Sources
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.visionairy.googly.phone
        PRODUCT_NAME: Velvet
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 3Q7ZZFFVFP
        # Set your team in Xcode (Signing & Capabilities) the first time you run it.
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: Velvet
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocalNetworkUsageDescription: Velvet finds the Mac app on your Wi-Fi so the character can look where it points.
        NSMicrophoneUsageDescription: Talk to Velvet. He listens while he's awake (double tap him to wake him up or put him to sleep).
        NSSpeechRecognitionUsageDescription: Velvet turns what you say into text right on your iPhone, so your question can be sent to the Mac. Nothing is sent to Apple or the cloud.
        NSBonjourServices:
          - _googly._tcp
        UIAppFonts:
          - Fredoka.ttf
          - IBMPlexSans.ttf
          - IBMPlexMono-Regular.ttf
          - IBMPlexMono-Medium.ttf
